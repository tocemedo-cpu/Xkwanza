services:
  - type: web
    name: xkwanza-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build --workspace=backend
    # Se a migração falhar, o arranque falha também (em vez de servir a app com o schema
    # desactualizado) — um incidente em 2026-09 mostrou que falhar em silêncio aqui deixa a
    # app a correr contra uma base de dados sem as colunas/tabelas mais recentes, resultando
    # em 500 em qualquer operação que as use, sem aviso nenhum no deploy.
    startCommand: npm run prisma:deploy --workspace=backend && npm start --workspace=backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "300"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: INSS_ADAPTER_MODE
        value: sandbox
      - key: ADMIN_TASK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: product-photos

  - type: web
    name: xkwanza-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace=frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
